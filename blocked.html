<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stay Focused</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="blocked-layout">
      <section class="card">
        <p class="eyebrow">Distraction blocked</p>
        <h1 id="title">Back to what matters.</h1>

        <blockquote id="quote" class="quote"></blockquote>
        <button id="back" type="button">Return to focus</button>
      </section>
      <div class="art-frame"><img id="motivation-image" src="" alt="" /></div>
    </main>
    <script src="blocked.js"></script>
  </body>
</html>
